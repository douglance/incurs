name: Rust

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: MCP schema provenance
        run: cargo xtask mcp-schema-sync --check
      - name: Skill provenance
        run: cargo xtask skill-sync --check
      - name: Check
        run: cargo check --workspace --all-features
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Build examples
        run: cargo build --examples --workspace --all-features

  plugin-installers:
    name: Plugin installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p incurs-cli

  mcp-conformance:
    name: MCP conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The conformance runner is an upstream npm CLI, not a dependency of this
      # repository. Node is here to launch it and nothing else.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start conformance server
        run: |
          cargo build -p incurs --example mcp_conformance --all-features
          target/debug/examples/mcp_conformance > /tmp/incurs-mcp-conformance.log 2>&1 &
          echo $! > /tmp/incurs-mcp-conformance.pid
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:3030/mcp; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/incurs-mcp-conformance.log
          exit 1
      - name: Active MCP standards
        run: npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.10 server --url http://127.0.0.1:3030/mcp --suite active --expected-failures tests/mcp/conformance-baseline.yml
      - name: MCP 2026-07-28
        run: npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.10 server --url http://127.0.0.1:3030/mcp --suite draft --expected-failures tests/mcp/conformance-baseline.yml
      - name: Stop conformance server
        if: always()
        run: kill "$(cat /tmp/incurs-mcp-conformance.pid)" || true

  release:
    name: Release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask release-check

  extensions:
    name: Extension workspace (${{ matrix.workspace }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cloudflare crates ship as Worker modules, so wasm32 is part of their
          # contract. GPUI links a native windowing backend and cannot build for
          # wasm32 at all, and its natural runner is the platform it bundles for.
          - workspace: cloudflare
            os: ubuntu-latest
            wasm: true
          - workspace: gpui
            os: macos-latest
            wasm: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.wasm && 'wasm32-unknown-unknown' || '' }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --manifest-path extensions/${{ matrix.workspace }}/Cargo.toml --all --check
      - name: Test
        run: cargo test --manifest-path extensions/${{ matrix.workspace }}/Cargo.toml --workspace --all-features
      - name: Clippy
        run: cargo clippy --manifest-path extensions/${{ matrix.workspace }}/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Wasm target
        if: matrix.wasm
        run: cargo check --manifest-path extensions/${{ matrix.workspace }}/Cargo.toml --workspace --target wasm32-unknown-unknown
