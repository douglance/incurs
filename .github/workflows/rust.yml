name: Rust

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: MCP schema provenance
        run: cargo xtask mcp-schema-sync --check
      - name: Skill provenance
        run: cargo xtask skill-sync --check
      - name: Check
        run: cargo check --workspace --all-features
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Build examples
        run: cargo build --examples --workspace --all-features

  features:
    # `--all-features` hides a feature that only compiles alongside another, so
    # each one is built alone. wasm32 is how Cloudflare Workers run incurs.
    name: Feature ${{ matrix.feature }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm32-unknown-unknown]
        feature: [none, default, cli, toon, tokens, yaml, http, openapi, agent-plugins, agent-plugins-mcp, all]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target != 'native' && matrix.target || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: |
          target=()
          [ "${{ matrix.target }}" = native ] || target=(--target "${{ matrix.target }}")
          case "${{ matrix.feature }}" in
            none) features=(--no-default-features) ;;
            default) features=() ;;
            all) features=(--all-features) ;;
            *) features=(--no-default-features --features "${{ matrix.feature }}") ;;
          esac
          cargo check -p incurs "${target[@]}" "${features[@]}"

  workers-smoke:
    # Compiling for wasm32 does not prove a feature runs: std clocks, process
    # environment, and exit all compile there and fail at runtime.
    name: Workers smoke (every feature under wrangler dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extensions/cloudflare
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Owned Worker process cleanup
        run: python3 extensions/cloudflare/examples/feature-worker/test_owned_process.py
      - run: cargo install worker-build --locked
      - run: extensions/cloudflare/examples/feature-worker/smoke.sh

  plugin-installers:
    name: Plugin installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p incurs-cli

  mcp-conformance:
    name: MCP conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The conformance runner is an upstream npm CLI, not a dependency of this
      # repository. Node is here to launch it and nothing else.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start conformance server
        run: |
          cargo build -p incurs --example mcp_conformance --all-features
          target/debug/examples/mcp_conformance > /tmp/incurs-mcp-conformance.log 2>&1 &
          echo $! > /tmp/incurs-mcp-conformance.pid
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:3030/mcp; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/incurs-mcp-conformance.log
          exit 1
      - name: Active MCP standards
        run: npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.10 server --url http://127.0.0.1:3030/mcp --suite active --expected-failures tests/mcp/conformance-baseline.yml
      - name: MCP 2026-07-28
        run: npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.10 server --url http://127.0.0.1:3030/mcp --suite draft --expected-failures tests/mcp/conformance-baseline.yml
      - name: Stop conformance server
        if: always()
        run: kill "$(cat /tmp/incurs-mcp-conformance.pid)" || true

  release:
    name: Release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask release-check

  extensions:
    name: Extension workspace (${{ matrix.workspace }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cloudflare crates ship as Worker modules, so wasm32 is part of their
          # contract. GPUI links a native windowing backend and cannot build for
          # wasm32 at all, and its natural runner is the platform it bundles for.
          - workspace: cloudflare
            os: ubuntu-latest
            wasm: true
          - workspace: openapi
            os: ubuntu-latest
            wasm: true
          - workspace: openai-mcp
            os: ubuntu-latest
            wasm: true
          - workspace: gpui
            os: macos-latest
            wasm: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.wasm && 'wasm32-unknown-unknown' || '' }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: OpenAI oracle Node
        if: matrix.workspace == 'openai-mcp'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: OpenAI Python oracle
        if: matrix.workspace == 'openai-mcp'
        uses: astral-sh/setup-uv@v6
      - name: Format
        run: cargo fmt --manifest-path extensions/${{ matrix.workspace }}/Cargo.toml --all --check
      - name: Test
        if: matrix.workspace != 'openapi'
        run: cargo test --manifest-path extensions/${{ matrix.workspace }}/Cargo.toml --workspace --all-features --locked
      - name: OpenAPI test
        if: matrix.workspace == 'openapi'
        run: cargo test --manifest-path extensions/openapi/Cargo.toml --workspace --all-features --locked -j 2 -- --test-threads=1
      - name: Clippy
        run: cargo clippy --manifest-path extensions/${{ matrix.workspace }}/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
      - name: Wasm target
        if: matrix.wasm
        run: cargo check --manifest-path extensions/${{ matrix.workspace }}/Cargo.toml --workspace --target wasm32-unknown-unknown --locked

      - name: OpenAI browser WASM clippy
        if: matrix.workspace == 'openai-mcp'
        run: cargo clippy -p incurs-mcp-apps --all-features --target wasm32-unknown-unknown --locked -- -D warnings
      - name: OpenAI documentation
        if: matrix.workspace == 'openai-mcp'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path extensions/openai-mcp/Cargo.toml --workspace --all-features --no-deps --locked
      - name: OpenAI pinned SDK parity
        if: matrix.workspace == 'openai-mcp'
        run: |
          npm ci --ignore-scripts --prefix extensions/openai-mcp/parity
          python3 extensions/openai-mcp/parity/check.py
          python3 extensions/openai-mcp/parity/differential.py
          python3 extensions/openai-mcp/parity/form-differential.py
          python3 extensions/openai-mcp/parity/helper-differential.py
          python3 extensions/openai-mcp/crates/incurs-openai-mcp/tests/native_stdio_probe.py
      - name: OpenAI server reference controls
        if: matrix.workspace == 'openai-mcp'
        working-directory: extensions/openai-mcp/parity
        run: node --import tsx server-oracle.mjs

      - name: OpenAI browser tooling
        if: matrix.workspace == 'openai-mcp'
        run: |
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          npx --yes --package=@playwright/test@1.56.1 playwright install-deps chromium
      - name: OpenAI browser runtime
        if: matrix.workspace == 'openai-mcp'
        run: node extensions/openai-mcp/crates/incurs-openai-mcp-app/examples/browser-smoke-gate.mjs
      - name: OpenAI server wasm tooling
        if: matrix.workspace == 'openai-mcp'
        run: |
          SDK_BINDGEN_VERSION=$(python3 -c 'import tomllib; data=tomllib.load(open("extensions/openai-mcp/Cargo.lock","rb")); versions={p["version"] for p in data["package"] if p["name"]=="wasm-bindgen"}; assert len(versions)==1, versions; print(versions.pop())')
          cargo install wasm-bindgen-cli --version "$SDK_BINDGEN_VERSION" --locked --root "${RUNNER_TEMP}/server-wasm-bindgen"
      - name: OpenAI server wasm runtime
        if: matrix.workspace == 'openai-mcp'
        env:
          WASM_BINDGEN: ${{ runner.temp }}/server-wasm-bindgen/bin/wasm-bindgen
        run: |
          cargo build --manifest-path extensions/openai-mcp/Cargo.toml -p incurs-openai-mcp --example openai_mcp_wasm_runtime --target wasm32-unknown-unknown --no-default-features --locked
          node extensions/openai-mcp/crates/incurs-openai-mcp/tests/wasm_runtime_probe.mjs

      - name: OpenAPI documentation
        if: matrix.workspace == 'openapi'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path extensions/openapi/Cargo.toml --all-features --no-deps --locked
      - name: OpenAPI portable adapters
        if: matrix.workspace == 'openapi'
        run: cargo check --manifest-path extensions/openapi/Cargo.toml --all-features --target wasm32-unknown-unknown --locked
      - name: OpenAPI independent features
        if: matrix.workspace == 'openapi'
        run: |
          for feature in adapters native-cli; do
            cargo check --manifest-path extensions/openapi/Cargo.toml --no-default-features --features "$feature" --all-targets --locked
            cargo check --manifest-path extensions/openapi/Cargo.toml --no-default-features --features "$feature" --target wasm32-unknown-unknown --locked
          done
      - name: OpenAPI imported CLI and MCP
        if: matrix.workspace == 'openapi'
        run: |
          cargo build --manifest-path extensions/openapi/Cargo.toml --features native-cli --example openapi --locked
          python3 extensions/openapi/probe_cli.py

  openapi-emscripten:
    # Experimental proof only; the existing Cloudflare target stays unchanged.
    name: OpenAPI Worker proof build (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extensions/openapi-workers
      - name: Run pinned Emscripten HTTP proof
        run: python3 extensions/openapi-workers/smoke.py
