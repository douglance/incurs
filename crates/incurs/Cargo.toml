[package]
name = "incurs"
version = "0.10.3"
edition = "2024"
rust-version = "1.88"
description = "A declarative CLI framework for Rust with typed commands, agent discovery, HTTP, and MCP"
readme = "../../README.md"
license = "MIT"
repository = "https://github.com/douglance/incurs"

[dependencies]
incurs-macros = { path = "../incurs-macros", version = "0.6.0" }
incurs-mcp-protocol = { path = "../incurs-mcp-protocol", version = "0.2.0" }
tokio = { version = "1", default-features = false, features = ["sync", "macros", "io-std", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10"
dirs = "6"
toon-format = { version = "0.4", optional = true }
tiktoken-rs = { version = "0.6", optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
url = { version = "2", optional = true }
http = { version = "1", optional = true }
sse-stream = { version = "0.2.4", optional = true }
axum = { version = "0.8", optional = true }
axum-streams = { version = "0.21", features = ["json"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", optional = true }
hyper = { version = "1", optional = true }
rmcp = { version = "=3.0.0-beta.5", features = ["client", "server", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
oas3 = { version = "0.20", optional = true }
openapiv3 = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }

[features]
default = ["cli", "toon", "tokens"]
cli = ["tokio/rt-multi-thread", "tokio/io-std", "tokio/io-util", "tokio/time", "tokio/signal", "tokio/process"]
toon = ["toon-format"]
tokens = ["tiktoken-rs"]
yaml = ["serde_yaml_ng"]
agent-plugins = ["yaml", "dep:url", "dep:http"]
agent-plugins-mcp = ["agent-plugins", "dep:reqwest", "dep:sse-stream", "rmcp/transport-child-process", "tokio/process", "tokio/rt-multi-thread", "tokio/time"]
http = ["axum", "axum-streams", "tower", "tower-http", "hyper", "yaml", "tokio/net", "dep:http"]
openapi = ["oas3", "openapiv3", "dep:reqwest", "yaml"]
# Retired. Serving MCP is unconditional, because every CLI advertises `--mcp` and
# a build that answered it with "requires the 'mcp' feature flag" was a tool that
# looked composable and was not. Kept as a no-op so manifests that still name it
# keep building.
mcp = []

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
async-trait = "0.1"
async-stream = "0.3"
serde_json = "1"
regex-lite = "0.1"
trybuild = "1"

[[example]]
name = "mcp_conformance"
required-features = ["http"]
