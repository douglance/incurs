[package]
name = "incurs"
version = "0.10.3"
edition = "2024"
rust-version = "1.88"
description = "A declarative CLI framework for Rust with typed commands, agent discovery, HTTP, and MCP"
readme = "../../README.md"
license = "MIT"
repository = "https://github.com/douglance/incurs"

[dependencies]
incurs-macros = { path = "../incurs-macros", version = "0.6.0" }
incurs-mcp-protocol = { path = "../incurs-mcp-protocol", version = "0.2.0" }
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10"
dirs = "6"
# `std::time` clocks panic on wasm32-unknown-unknown; this reads the host's
# timer there and re-exports `std::time` everywhere else.
web-time = "1"
toon-format = { version = "0.4", default-features = false, optional = true }
tiktoken-rs = { version = "0.6", optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
url = { version = "2", optional = true }
http = { version = "1", optional = true }
axum = { version = "0.8", default-features = false, features = ["json", "query", "form", "matched-path", "original-uri"], optional = true }
tower = { version = "0.5", optional = true }
oas3 = { version = "0.20", optional = true }
openapiv3 = { version = "2", optional = true }

# A wasm32 host such as a Cloudflare Worker has no process, stdio, threads,
# signals, or sockets. Everything that needs them is declared here, so every
# feature compiles for Workers. A Cargo feature cannot enable a dependency
# feature for one target only, so native builds always get the full runtime.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["io-std", "io-util", "rt-multi-thread", "time", "signal", "process", "net"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"], optional = true }
rmcp = { version = "=3.0.0-beta.5", features = ["client", "server", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
# The native default `incurs::outbound::HttpClient`. wasm32 hosts supply
# their own client, so reqwest never enters a wasm32 build.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }

[features]
default = ["cli", "toon", "tokens"]
cli = []
toon = ["toon-format"]
tokens = ["tiktoken-rs"]
yaml = ["serde_yaml_ng"]
agent-plugins = ["yaml", "dep:url", "dep:http"]
agent-plugins-mcp = ["agent-plugins", "dep:reqwest", "rmcp/transport-child-process"]
http = ["axum", "tower", "yaml", "dep:http", "dep:url", "dep:reqwest"]
openapi = ["oas3", "openapiv3", "dep:reqwest", "yaml"]
# Retired. Serving MCP is unconditional, because every CLI advertises `--mcp` and
# a build that answered it with "requires the 'mcp' feature flag" was a tool that
# looked composable and was not. Kept as a no-op so manifests that still name it
# keep building.
mcp = []

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
async-trait = "0.1"
async-stream = "0.3"
serde_json = "1"
regex-lite = "0.1"
trybuild = "1"

[[example]]
name = "mcp_conformance"
required-features = ["http"]

[[example]]
name = "mcp_conformance_portable"
required-features = ["http"]
