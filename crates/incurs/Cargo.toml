[package]
name = "incurs"
version = "0.4.0"
edition = "2024"
description = "A declarative CLI framework for Rust with typed commands, agent discovery, HTTP, and MCP"
license = "MIT"
repository = "https://github.com/douglance/incurs"

[dependencies]
incurs-macros = { path = "../incurs-macros", version = "0.4.0" }
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10"
dirs = "6"
toon-format = { version = "0.4", optional = true }
tiktoken-rs = { version = "0.6", optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
axum = { version = "0.8", optional = true }
axum-streams = { version = "0.21", features = ["json"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", optional = true }
hyper = { version = "1", optional = true }
rmcp = { version = "2.2", features = ["client", "server", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"], optional = true }
oas3 = { version = "0.20", optional = true }
openapiv3 = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

[features]
default = ["cli", "toon", "tokens"]
cli = ["tokio/rt-multi-thread", "tokio/io-std", "tokio/io-util", "tokio/time", "tokio/signal", "tokio/process"]
toon = ["toon-format"]
tokens = ["tiktoken-rs"]
yaml = ["serde_yaml_ng"]
http = ["axum", "axum-streams", "tower", "tower-http", "hyper", "yaml", "tokio/net"]
mcp = ["rmcp", "tokio/io-std", "tokio/io-util"]
openapi = ["oas3", "openapiv3", "reqwest", "yaml"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
async-trait = "0.1"
async-stream = "0.3"
serde_json = "1"
regex-lite = "0.1"
trybuild = "1"
