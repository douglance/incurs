[package]
name = "incurs-app-model"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Toolkit-neutral interaction model for interactive incurs surfaces"
readme = "README.md"
license = "MIT"
repository = "https://github.com/douglance/incurs"

[dependencies]
incurs = { path = "../incurs", version = "0.9.0", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"

[dev-dependencies]
async-trait = "0.1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
