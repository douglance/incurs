[package]
name = "incurs-mcp-discovery"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Reads and normalizes MCP server configuration already present in installed coding agents"
repository = "https://github.com/douglance/incurs"
readme = "README.md"

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "1"
