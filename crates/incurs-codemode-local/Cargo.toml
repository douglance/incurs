[package]
name = "incurs-codemode-local"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "Local QuickJS executor for incurs Code Mode"
repository = "https://github.com/douglance/incurs"
readme = "README.md"

[dependencies]
async-trait = "0.1"
incurs-codemode = { path = "../incurs-codemode", version = "0.2.0" }
rquickjs = { version = "0.12", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }

[dev-dependencies]
incurs = { path = "../incurs", version = "0.5.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
