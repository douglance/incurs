[package]
name = "incurs-app-ratatui"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal application surface for incurs command graphs, built on ratatui"
readme = "README.md"
license = "MIT"
repository = "https://github.com/douglance/incurs"

[dependencies]
incurs = { path = "../incurs", version = "0.8.0", default-features = false }
incurs-app-model = { path = "../incurs-app-model", version = "0.3.0" }
ratatui = "0.30"
serde_json = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
async-trait = "0.1"
futures = "0.3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[[example]]
name = "todo_tui"

[[example]]
name = "custom_ui"
