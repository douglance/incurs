[package]
name = "incurs-cli"
version = "0.6.0"
edition = "2024"
description = "Code generation and Agent Plugins client tools for incurs-based Rust CLIs"
readme = "../../README.md"
license = "MIT"
repository = "https://github.com/douglance/incurs"

[[bin]]
name = "incurs"
path = "src/main.rs"
doc = false

[dependencies]
dirs = "6"
incurs = { path = "../incurs", version = "0.6.0", features = ["cli", "agent-plugins-mcp"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
syn = { version = "2", features = ["full"] }
