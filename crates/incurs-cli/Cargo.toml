[package]
name = "incurs-cli"
version = "0.8.0"
edition = "2024"
description = "Code generation and Agent Plugins client tools for incurs-based Rust CLIs"
readme = "../../README.md"
license = "MIT"
repository = "https://github.com/douglance/incurs"

[[bin]]
name = "incurs"
path = "src/main.rs"
doc = false

[features]
# On by default: this is a binary, and a default-off flag would mean
# `cargo install incurs-cli` does not get the interface `--tui` advertises.
default = ["tui"]
tui = ["dep:incurs-app-ratatui"]

[dependencies]
dirs = "6"
incurs = { path = "../incurs", version = "0.8.0", features = ["cli", "agent-plugins-mcp"] }
incurs-app-ratatui = { path = "../incurs-app-ratatui", version = "0.3.0", optional = true }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
syn = { version = "2", features = ["full"] }
