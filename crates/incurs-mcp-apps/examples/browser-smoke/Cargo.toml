[package]
name = "browser-smoke"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures = "0.3"
incurs-mcp-apps = { path = "../..", version = "0.1.0" }
js-sys = "=0.3.103"
serde-wasm-bindgen = "0.6"
serde_json = "1"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"
web-sys = { version = "=0.3.103", features = ["Document", "Element", "HtmlIFrameElement", "Node", "Window"] }
