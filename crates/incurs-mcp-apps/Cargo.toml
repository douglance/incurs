[package]
name = "incurs-mcp-apps"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Provider-neutral MCP App runtime bridge for Rust and WASM clients"
repository = "https://github.com/douglance/incurs"
readme = "README.md"

[dependencies]
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "EventTarget", "HtmlElement", "HtmlIFrameElement", "MessageEvent", "Node", "Window"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
wasm-bindgen-test = "0.3"
