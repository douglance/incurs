[package]
name = "incurs-codemode-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Provider-neutral MCP lifecycle facade for incurs Code Mode"
repository = "https://github.com/douglance/incurs"
readme = "README.md"

[dependencies]
http = "1"
incurs = { path = "../incurs", version = "0.5.0" }
incurs-codemode = { path = "../incurs-codemode", version = "0.1.0" }
rmcp = { version = "2.2", features = ["server", "transport-io"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-std"] }

[dev-dependencies]
async-trait = "0.1"
incurs-codemode-local = { path = "../incurs-codemode-local", version = "0.1.0" }
rmcp = { version = "2.2", features = ["client"] }
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
