[package]
name = "incurs-codemode-mcp"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Provider-neutral MCP lifecycle facade for incurs Code Mode"
repository = "https://github.com/douglance/incurs"
readme = "README.md"

[dependencies]
http = "1"
incurs = { path = "../incurs", version = "0.7.0" }
incurs-codemode = { path = "../incurs-codemode", version = "0.5.0" }
incurs-mcp-protocol = { path = "../incurs-mcp-protocol", version = "0.2.0" }
rmcp = { version = "=3.0.0-beta.5", features = ["server", "transport-io"] }
serde = "1"
serde_json = "1"
tokio-util = { version = "0.7" }
tokio = { version = "1", default-features = false, features = ["io-std"] }

[dev-dependencies]
async-trait = "0.1"
incurs-codemode-local = { path = "../incurs-codemode-local", version = "0.5.0" }
rmcp = { version = "=3.0.0-beta.5", features = ["client"] }
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
