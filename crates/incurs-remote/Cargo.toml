[package]
name = "incurs-remote"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Provider-neutral remote capability protocol and runtime seam for incurs tools"
repository = "https://github.com/douglance/incurs"
readme = "README.md"

[dependencies]
async-trait = "0.1"
incurs = { path = "../incurs", version = "0.8.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
schemars = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
