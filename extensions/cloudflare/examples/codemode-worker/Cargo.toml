[package]
name = "incurs-codemode-worker-example"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
incurs = { path = "../../../../crates/incurs", version = "0.13.0", default-features = false }
incurs-codemode = { path = "../../../../crates/incurs-codemode", version = "0.11.0" }
incurs-codemode-cloudflare = { path = "../../crates/incurs-codemode-cloudflare", version = "0.11.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
worker = "0.8.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
