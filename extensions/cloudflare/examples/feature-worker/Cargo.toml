[package]
name = "incurs-feature-worker-example"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["json"] }
futures = "0.3"
incurs = { path = "../../../../crates/incurs", version = "0.13.0", default-features = false, features = ["cli", "toon", "tokens", "yaml", "http", "openapi", "agent-plugins", "agent-plugins-mcp"] }
incurs-mcp-cloudflare = { path = "../../crates/incurs-mcp-cloudflare", version = "0.9.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-service = "0.3"
worker = { version = "0.8.5", features = ["http", "axum"] }
