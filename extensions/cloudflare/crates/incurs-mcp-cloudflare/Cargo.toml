[package]
name = "incurs-mcp-cloudflare"
version = "0.7.0"
edition = "2024"
license = "MIT"
description = "Stateless Cloudflare Streamable HTTP MCP adapter for incurs ToolCatalog"
repository = "https://github.com/douglance/incurs"
readme = "README.md"

[dependencies]
incurs = { path = "../../../../crates/incurs", version = "0.11.0", default-features = false }
incurs-mcp-protocol = { path = "../../../../crates/incurs-mcp-protocol", version = "0.2.1" }
serde_json = "1"

# `WorkersHttpClient` sends incurs's outbound HTTP through the Workers `fetch`
# API, which exists only on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
async-trait = "0.1"
futures = "0.3"
worker = "0.8.5"

[dev-dependencies]
schemars = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt"] }
