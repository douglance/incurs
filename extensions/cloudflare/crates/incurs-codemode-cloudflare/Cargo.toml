[package]
name = "incurs-codemode-cloudflare"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cloudflare WorkerLoader and Durable Object adapters for incurs Code Mode"

[dependencies]
incurs-codemode = { path = "../../../../crates/incurs-codemode" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-trait = "0.1"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
worker = "0.8.5"
