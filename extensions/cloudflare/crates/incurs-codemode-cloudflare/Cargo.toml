[package]
name = "incurs-codemode-cloudflare"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cloudflare WorkerLoader and Durable Object adapters for incurs Code Mode"
repository = "https://github.com/douglance/incurs"
readme = "README.md"

[dependencies]
async-trait = "0.1"
incurs = { path = "../../../../crates/incurs", version = "0.5.0", default-features = false }
incurs-codemode = { path = "../../../../crates/incurs-codemode", version = "0.1.1" }
incurs-mcp-protocol = { path = "../../../../crates/incurs-mcp-protocol", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
worker = "0.8.5"

[dev-dependencies]
incurs-codemode-mcp = { path = "../../../../crates/incurs-codemode-mcp", version = "0.1.0" }
tokio = { version = "1", features = ["macros", "rt"] }
