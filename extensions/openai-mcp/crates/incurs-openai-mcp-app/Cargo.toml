[package]
name = "incurs-openai-mcp-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT AND Apache-2.0"
description = "OpenAI MCP App helper surface for Rust and WASM clients"
repository = "https://github.com/douglance/incurs"
include = [
    "Cargo.toml",
    "src/**",
    "tests/**",
    "styles.css",
    "LICENSE.openai-mcp-extensions-Apache-2.0",
    "NOTICE.openai-mcp-extensions.md",
    "examples/browser-smoke-gate.mjs",
    "examples/browser-smoke-package.json",
    "examples/browser-smoke-package-lock.json",
]

[dependencies]
incurs-mcp-apps = { path = "../../../../crates/incurs-mcp-apps", version = "0.1.0" }
incurs-openai-mcp-protocol = { path = "../incurs-openai-mcp-protocol", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CssStyleDeclaration", "Document", "Element", "HtmlElement", "Window"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
