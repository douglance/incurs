[workspace]
members = [
  "crates/incurs-openai-mcp-protocol",
  "crates/incurs-openai-mcp-app",
  "crates/incurs-openai-mcp",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/douglance/incurs"
publish = false

[workspace.dependencies]
base64 = "0.22"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "2"
incurs-openai-mcp-protocol = { path = "crates/incurs-openai-mcp-protocol", version = "0.1.0" }
