[package]
name = "incurs-openapi"
version = "0.1.1"
edition = "2024"
description = "Compile OpenAPI contracts into Rust SDKs, documentation, and incurs tools"
readme = "README.md"
license = "MIT"
repository = "https://github.com/douglance/incurs"
keywords = ["openapi", "codegen", "sdk", "mcp"]
categories = ["development-tools", "api-bindings"]
publish = true

[workspace]

[features]
default = []
native-cli = ["adapters", "incurs/http"]
adapters = ["dep:async-trait", "dep:incurs", "dep:incurs-codemode", "dep:incurs-remote", "dep:tokio-util"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
jsonschema = { version = "=0.58.2", default-features = false, features = ["arbitrary-precision"] }
sha2 = "0.10"
thiserror = "2"
url = "2"
async-trait = { version = "0.1", optional = true }
incurs = { path = "../../crates/incurs", version = "0.13.0", default-features = false, optional = true }
incurs-codemode = { path = "../../crates/incurs-codemode", version = "0.11.0", default-features = false, optional = true }
incurs-remote = { path = "../../crates/incurs-remote", version = "0.9.0", default-features = false, optional = true }
tokio-util = { version = "0.7", optional = true }

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }
tokio-util = "0.7"

[lints.rust]
missing_docs = "deny"
